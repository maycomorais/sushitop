
<style>
._crit{font-size:.72rem;color:var(--color-text-secondary);transition:color .25s}
._crit.ok{color:#22c55e}
</style>

<div style="min-height:520px;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;border-radius:var(--border-radius-lg)">
  <div style="background:var(--color-background-primary);border-radius:20px;width:100%;max-width:400px;overflow:hidden;font-family:var(--font-sans)">

    <div style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);padding:24px 24px 20px;position:relative">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="background:rgba(255,255,255,0.12);border-radius:12px;padding:10px;font-size:22px;line-height:1"><i class="ti ti-lock" style="color:#fff;font-size:22px"></i></div>
        <div>
          <div style="color:#fff;font-size:1.1rem;font-weight:500;letter-spacing:-.2px">Alterar senha</div>
          <div style="color:rgba(255,255,255,0.55);font-size:0.78rem;margin-top:2px">Escolha uma senha forte</div>
        </div>
      </div>
      <button style="position:absolute;top:14px;right:16px;background:rgba(255,255,255,0.12);border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center">
        <i class="ti ti-x" style="font-size:13px"></i>
      </button>
    </div>

    <div style="padding:20px 22px 16px">

      <div style="margin-bottom:16px">
        <label style="font-size:0.72rem;font-weight:500;color:var(--color-text-secondary);letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:6px">Nova senha</label>
        <div style="position:relative">
          <input type="password" id="pw-demo" value="MinhaS3nh@!"
            oninput="avaliar(this.value)"
            style="width:100%;padding:10px 40px 10px 13px;border:2px solid #0f3460;border-radius:10px;font-size:0.9rem;outline:none;box-sizing:border-box;background:var(--color-background-primary);color:var(--color-text-primary)"/>
          <i class="ti ti-eye" id="eye1" onclick="tog('pw-demo','eye1')" style="position:absolute;right:11px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:17px;color:var(--color-text-secondary)"></i>
        </div>
        <div style="margin-top:7px">
          <div style="display:flex;gap:4px;height:5px;border-radius:4px;overflow:hidden">
            <div id="b1" style="flex:1;border-radius:4px;transition:background .3s;background:#22c55e"></div>
            <div id="b2" style="flex:1;border-radius:4px;transition:background .3s;background:#22c55e"></div>
            <div id="b3" style="flex:1;border-radius:4px;transition:background .3s;background:#22c55e"></div>
            <div id="b4" style="flex:1;border-radius:4px;transition:background .3s;background:#22c55e"></div>
          </div>
          <div id="flbl" style="font-size:0.72rem;color:#22c55e;margin-top:4px;font-weight:500">Forte 💪</div>
        </div>
        <div style="margin-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px">
          <div id="c1" class="_crit ok"><i class="ti ti-check" style="font-size:11px"></i> Mínimo 8 caracteres</div>
          <div id="c2" class="_crit ok"><i class="ti ti-check" style="font-size:11px"></i> Número</div>
          <div id="c3" class="_crit ok"><i class="ti ti-check" style="font-size:11px"></i> Letra maiúscula</div>
          <div id="c4" class="_crit ok"><i class="ti ti-check" style="font-size:11px"></i> Caractere especial</div>
        </div>
      </div>

      <div style="margin-bottom:6px">
        <label style="font-size:0.72rem;font-weight:500;color:var(--color-text-secondary);letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:6px">Confirmar senha</label>
        <div style="position:relative">
          <input type="password" id="pw-conf" value="MinhaS3nh@!"
            oninput="checkMatch()"
            style="width:100%;padding:10px 40px 10px 13px;border:2px solid #22c55e;border-radius:10px;font-size:0.9rem;outline:none;box-sizing:border-box;background:var(--color-background-primary);color:var(--color-text-primary)"/>
          <i class="ti ti-eye" id="eye2" onclick="tog('pw-conf','eye2')" style="position:absolute;right:11px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:17px;color:var(--color-text-secondary)"></i>
        </div>
        <div id="mlbl" style="font-size:0.78rem;color:#22c55e;margin-top:5px;font-weight:500">
          <i class="ti ti-check" style="font-size:12px"></i> Senhas coincidem
        </div>
      </div>
    </div>

    <div style="padding:0 22px 20px;display:flex;gap:10px">
      <button style="flex:1;padding:11px;background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:10px;font-size:0.88rem;font-weight:500;cursor:pointer">Cancelar</button>
      <button style="flex:2;padding:11px;background:linear-gradient(135deg,#0f3460,#533483);color:#fff;border:none;border-radius:10px;font-size:0.88rem;font-weight:500;cursor:pointer;letter-spacing:.2px">
        <i class="ti ti-lock" style="font-size:14px;vertical-align:-1px;margin-right:5px"></i>Salvar nova senha
      </button>
    </div>
  </div>
</div>

<script>
const cores  = ['#e2e8f0','#ef4444','#f97316','#eab308','#22c55e'];
const labels = ['','Fraca 😬','Razoável 😐','Boa 👍','Forte 💪'];

function avaliar(v) {
  const checks = [v.length>=8, /\d/.test(v), /[A-Z]/.test(v), /[^A-Za-z0-9]/.test(v)];
  const score = checks.filter(Boolean).length;
  const ids = ['c1','c2','c3','c4'];
  const txts = ['Mínimo 8 caracteres','Número','Letra maiúscula','Caractere especial'];
  ids.forEach((id,i)=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.innerHTML = `<i class="ti ti-${checks[i]?'check':'x'}" style="font-size:11px"></i> ${txts[i]}`;
    el.classList.toggle('ok', checks[i]);
  });
  for(let i=1;i<=4;i++){
    const b=document.getElementById('b'+i);
    if(b) b.style.background = i<=score ? cores[score] : '#e2e8f0';
  }
  const fl=document.getElementById('flbl');
  if(fl){fl.textContent=labels[score];fl.style.color=cores[score];}
  checkMatch();
}

function checkMatch(){
  const a=document.getElementById('pw-demo')?.value||'';
  const b=document.getElementById('pw-conf')?.value||'';
  const ml=document.getElementById('mlbl');
  const inp=document.getElementById('pw-conf');
  if(!ml||!b)return;
  const ok=a===b&&b.length>0;
  ml.innerHTML=ok?'<i class="ti ti-check" style="font-size:12px"></i> Senhas coincidem':'<i class="ti ti-x" style="font-size:12px"></i> Senhas não coincidem';
  ml.style.color=ok?'#22c55e':'#ef4444';
  if(inp) inp.style.borderColor=b.length>0?(ok?'#22c55e':'#ef4444'):'#e2e8f0';
}

function tog(id,eid){
  const inp=document.getElementById(id);
  const ico=document.getElementById(eid);
  if(!inp)return;
  inp.type=inp.type==='password'?'text':'password';
  ico.className=`ti ti-eye${inp.type==='password'?'':'-off'}`;
}

avaliar(document.getElementById('pw-demo').value);
</script>
